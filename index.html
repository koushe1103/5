<style>
:root {
    --bg: #f4f7fa; --card-bg: #fff; --text: #1f2937; --muted: #9ca3af;
    --accent: #ff6b6b; --teal: #14b8a6; --blue: #6366f1; --green: #22c55e;
    --red: #ef4444; --amber: #f59e0b; --purple: #8b5cf6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; justify-content: center; padding: 1rem 0.8rem;
}
.app { width: 100%; max-width: 460px; }
.header { text-align: center; margin-bottom: 0.8rem; }
.header h1 { font-size: 1.25rem; color: var(--accent); margin-bottom: 2px; }
.header .sub { font-size: 0.78rem; color: var(--muted); }
.bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 0.8rem; padding: 0 2px;
}
.bar .score { color: var(--accent); font-weight: 800; font-size: 1.1rem; }
.bar .remain { color: var(--muted); font-weight: 600; font-size: 0.9rem; }

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 1rem;
}

.card {
    background: var(--card-bg); border: 2px solid #e5e7eb;
    border-radius: 14px; padding: 10px 6px; text-align: center;
    cursor: pointer; user-select: none; transition: all .25s;
    min-height: 96px; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; gap: 6px;
}
.card:hover { border-color: var(--blue); transform: translateY(-2px); }
.card.active {
    border-color: var(--blue); background: #eef2ff;
    box-shadow: 0 0 0 4px rgba(99,102,241,0.2);
}
.card.correct {
    border-color: var(--green); background: #f0fdf4;
}
.card.correct.removing {
    opacity: 0; transform: scale(0.6);
    pointer-events: none;
    transition: opacity .45s ease, transform .45s ease;
}
.card.wrong {
    border-color: var(--red); background: #fef2f2;
    animation: shake .38s ease;
}
.card .cn {
    font-size: 0.85rem; font-weight: 700; color: var(--text); line-height: 1.1;
}
.card .word {
    font-size: 1.1rem; font-weight: 800; letter-spacing: 1px;
    color: #374151; font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
}
.card .word .blank-char { color: #d1d5db; }
.card .inputs {
    display: flex; justify-content: center; gap: 4px; margin-top: 2px;
}
.card .inputs input {
    width: 28px; height: 34px; border: 2px solid #d1d5db;
    border-radius: 6px; text-align: center; font-size: 1rem; font-weight: 800;
    color: var(--text); outline: none; padding: 0; text-transform: lowercase;
    transition: all .15s;
}
.card .inputs input:focus { border-color: var(--blue); background: #eff6ff; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
.card .inputs input.correct { border-color: var(--green); background: #dcfce7; color: #166534; }
.card .inputs input.wrong { border-color: var(--red); background: #fef2f2; }
.card .inputs input:disabled { background: #f3f4f6; color: #9ca3af; cursor: default; }
.card .try-hint {
    font-size: 0.62rem; color: var(--red); display: flex; align-items: center; gap: 2px;
}

@keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(3px); }
}

.hint-bar {
    background: #fff; border: 2px dashed #e5e7eb; border-radius: 12px;
    padding: 10px; text-align: center; font-size: 0.85rem; color: var(--muted);
    margin-bottom: 1rem;
}
.hint-bar .selected { color: var(--blue); font-weight: 700; }

/* Overlay */
.overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; animation: fadeIn .3s; padding: 1rem;

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.overlay .popup {

/* Word manager */

<script>
(function() {
    var DEFAULT_WORDS = [
        { en: "draw", cn: "画画" },
        { en: "dance", cn: "跳舞" },
        { en: "run", cn: "跑" },
        { en: "jump", cn: "跳" },
        { en: "walk", cn: "走" },
        { en: "cool", cn: "酷的" },
        { en: "player", cn: "运动员" },
        { en: "rabbit", cn: "兔子" },
        { en: "umbrella", cn: "伞" },
        { en: "be good at", cn: "擅长" },
        { en: "tell a story", cn: "讲故事" },
        { en: "use the computer", cn: "用电脑" },
        { en: "be proud of", cn: "自豪" },
        { en: "fly high", cn: "飞得高" }
    ];

    function loadWords() {
        try {
            var raw = localStorage.getItem("spell_words");
            if (raw) {
                var data = JSON.parse(raw);
                if (Array.isArray(data) && data.length > 0) return data;
            }
        } catch (e) { /* ignore */ }
        return DEFAULT_WORDS.slice();
    }

    function saveWords(words) {
        try { localStorage.setItem("spell_words", JSON.stringify(words)); } catch(e) {}
    }

    var WORDS = loadWords();

    var $ = function(id) { return document.getElementById(id); };

    var state = {
        cards: [],
        totalCards: 0,
        removed: 0,
        score: 0,
        activeId: null,
        wrongCount: {},
        locked: false
    };

    function shuffle(a) {
        var b = a.slice();
        for (var i = b.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = b[i]; b[i] = b[j]; b[j] = t;
        }
        return b;
    }

    // Generate blank positions for a word. Returns array of indices (0-based) to hide.
    // patternIdx ensures 3 different sets per word.
    function getBlankPositions(word, patternIdx) {
        var letterPositions = [];
        for (var i = 0; i < word.length; i++) { if (word[i] !== ' ') letterPositions.push(i); }
        var totalLetters = letterPositions.length;
        if (totalLetters <= 0) return [];

        // Hide 30% - 60% of letters, at least 1, never all
        var minHide = 1;
        var maxHide = Math.max(1, Math.floor(totalLetters * 0.6));
        if (totalLetters <= 2) { minHide = 1; maxHide = 1; }
        var hideCount = minHide + Math.floor(Math.random() * (maxHide - minHide + 1));
        if (hideCount >= totalLetters) hideCount = totalLetters - 1;
        if (hideCount < 1) hideCount = 1;

        var shuffled = shuffle(letterPositions);
        // shift starting offset by patternIdx to make 3 cards differ
        var start = (patternIdx * hideCount) % totalLetters;
        var result = [];
        for (var i = 0; i < hideCount; i++) {
            result.push(shuffled[(start + i) % totalLetters]);
        }
        return result;
    }

    function speak(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = "en-US"; u.rate = 0.85; u.pitch = 1;
        window.speechSynthesis.speak(u);
    }

    function buildCards() {
        var wordPool = shuffle(WORDS);
        var selected = wordPool.slice(0, 6); // 6 words

        state.cards = [];
        state.removed = 0;
        state.score = 0;
        state.activeId = null;
        state.wrongCount = {};
        state.locked = false;

        var id = 0;
        for (var wi = 0; wi < selected.length; wi++) {
            for (var ci = 0; ci < 3; ci++) {
                state.cards.push({
                    id: id,
                    word: selected[wi],
                    blanks: getBlankPositions(selected[wi].en, ci),
                    removed: false
                });
                id++;
            }
        }
        state.totalCards = state.cards.length; // 18
        state.cards = shuffle(state.cards);

        renderGrid();
    }

    function renderGrid() {
        var grid = $("cardGrid");
        var h = '';
        for (var i = 0; i < state.cards.length; i++) {
            var c = state.cards[i];
            if (c.removed) continue;
            var activeClass = (state.activeId === c.id) ? ' active' : '';
            h += '<div class="card' + activeClass + '" data-id="' + c.id + '" onclick="window._cardClick(' + c.id + ')">';
            h += '  <div class="cn">' + escapeHtml(c.word.cn) + '</div>';
            h += '  <div class="word">' + renderWord(c.word.en, c.blanks) + '</div>';
            h += '  <div class="inputs">' + renderInputs(c.id, c.blanks.length) + '</div>';
            if (state.wrongCount[c.word.en] && state.wrongCount[c.word.en] > 0) {
                h += '  <div class="try-hint">⚠ 答错 ' + state.wrongCount[c.word.en] + ' 次</div>';
            }
            h += '</div>';
        }
        grid.innerHTML = h;
        bindInputEvents();
        $("score").textContent = state.score;
        $("remain").textContent = state.totalCards - state.removed;

        // Focus active card's first blank input
        if (state.activeId !== null) {
            var firstInp = grid.querySelector('.card[data-id="' + state.activeId + '"] input');
            if (firstInp) firstInp.focus();
        }
    }

    function renderWord(word, blanks) {
        var hideSet = {};
        for (var i = 0; i < blanks.length; i++) hideSet[blanks[i]] = true;
        var html = '';
        for (var i = 0; i < word.length; i++) {
            if (word[i] === ' ') html += '<span class="blank-char">&nbsp;</span>';
            else if (hideSet[i]) html += '<span class="blank-char">_</span>';
            else html += word[i];
        }
        return html;
    }

    function renderInputs(cardId, blankCount) {
        var s = '';
        for (var i = 0; i < blankCount; i++) {
            s += '<input type="text" maxlength="1" data-cardid="' + cardId + '" data-idx="' + i + '" ';
            s += 'autocomplete="off" autocapitalize="off">';
        }
        return s;
    }

    function bindInputEvents() {
        var inputs = document.querySelectorAll('.card .inputs input');
        for (var i = 0; i < inputs.length; i++) {
            inputs[i].addEventListener('keydown', onInputKey);
            inputs[i].addEventListener('input', onInputType);
            inputs[i].addEventListener('focus', onInputFocus);
            inputs[i].addEventListener('paste', function(e) { e.preventDefault(); });
        }
    }

    function onInputFocus(e) {
        var cardId = parseInt(e.target.getAttribute('data-cardid'));
        if (state.activeId !== cardId && !state.locked) {
            state.activeId = cardId;
            renderGrid();
        }
    }

    function onInputKey(e) {
        var cardId = parseInt(e.target.getAttribute('data-cardid'));
        var idx = parseInt(e.target.getAttribute('data-idx'));
        var card = getCard(cardId);
        if (!card) return;
        var inputs = getCardInputs(cardId);

        if (e.key === 'Backspace') {
            if (e.target.value === '' && idx > 0) {
                inputs[idx - 1].focus();
            } else {
                e.target.value = '';
            }
            return;
        }
        if (e.key === 'Enter') {
            e.preventDefault();
            trySubmit(card);
            return;
        }
        if (e.key.length === 1 && /^[a-zA-Z\u4e00-\u9fa5 ]$/.test(e.key)) {
            e.preventDefault();
            e.target.value = e.key.toLowerCase();
            if (idx < inputs.length - 1) {
                inputs[idx + 1].focus();
            } else {
                trySubmit(card);
            }
        }
    }

    function onInputType(e) {
        // Prevent multi-character input, keep only last char
        var val = e.target.value;
        if (val.length > 1) e.target.value = val.slice(-1).toLowerCase();
    }

    function getCard(id) {
        for (var i = 0; i < state.cards.length; i++) {
            if (state.cards[i].id === id && !state.cards[i].removed) return state.cards[i];
        }
        return null;
    }

    function getCardInputs(cardId) {
        return document.querySelectorAll('.card[data-id="' + cardId + '"] input');
    }

    function getCardEl(cardId) {
        return document.querySelector('.card[data-id="' + cardId + '"]');
    }

    function trySubmit(card) {
        if (state.locked || card.removed) return;
        var inputs = getCardInputs(card.id);
        var filled = '';
        for (var i = 0; i < inputs.length; i++) {
            filled += (inputs[i].value || '').toLowerCase();
        }
        if (filled.length < card.blanks.length) {
            $("hintBar").innerHTML = '<span class="selected">⚠ 请把缺失字母全部填完再提交</span>';
            return;
        }

        var correct = buildAnswer(card.word.en, card.blanks) === filled;
        state.locked = true;
        var cardEl = getCardEl(card.id);

        if (correct) {
            // Mark inputs correct and green
            for (var i = 0; i < inputs.length; i++) inputs[i].classList.add('correct');
            if (cardEl) cardEl.classList.add('correct');
            $("hintBar").innerHTML = '<span class="selected">✅ ' + card.word.cn + ' — ' + card.word.en + '</span>';
            speak(card.word.en);

            setTimeout(function() {
                if (cardEl) cardEl.classList.add('removing');
                card.removed = true;
                state.removed++;
                state.score += 10;
                state.activeId = null;
                state.locked = false;
                $("score").textContent = state.score;
                $("remain").textContent = state.totalCards - state.removed;
                $("hintBar").textContent = '👆 点击下一张卡片继续';

                setTimeout(function() {
                    renderGrid();
                    if (state.removed >= state.totalCards) showVictory();
                }, 460);
            }, 600);
        } else {
            state.wrongCount[card.word.en] = (state.wrongCount[card.word.en] || 0) + 1;
            state.score = Math.max(0, state.score - 3);
            if (cardEl) cardEl.classList.add('wrong');
            for (var i = 0; i < inputs.length; i++) inputs[i].classList.add('wrong');
            $("hintBar").innerHTML = '<span class="selected">❌ ' + card.word.cn + ' 不对，再试一次！</span>';

            setTimeout(function() {
                if (cardEl) cardEl.classList.remove('wrong');
                for (var i = 0; i < inputs.length; i++) {
                    inputs[i].classList.remove('wrong');
                    inputs[i].value = '';
                }
                state.locked = false;
                if (inputs.length) inputs[0].focus();
                renderGrid();
            }, 450);
        }
    }

    // Reconstruct the expected missing letters in order
    function buildAnswer(word, blanks) {
        blanks = blanks.slice().sort(function(a, b) { return a - b; });
        var ans = '';
        for (var i = 0; i < blanks.length; i++) ans += word[blanks[i]];
        return ans;
    }

    window._cardClick = function(cardId) {
        if (state.locked) return;
        var card = getCard(cardId);
        if (!card) return;
        if (state.activeId === cardId) return;
        state.activeId = cardId;
        renderGrid();
    };

    function showVictory() {
        var totalWrong = 0;
        for (var k in state.wrongCount) totalWrong += state.wrongCount[k];

        var overlay = document.createElement("div");
        overlay.className = "overlay";
        var h = '<div class="popup">';
        h += '<div class="trophy">🏆</div>';
        h += '<div class="msg">全部消除！</div>';
        h += '<div class="detail">得分 ' + state.score + ' &nbsp;|&nbsp; 答错 ' + totalWrong + ' 次</div>';
        if (totalWrong > 0) {
            h += '<div class="details">';
            for (var k in state.wrongCount) {
                if (state.wrongCount[k] > 0) {
                    var cn = "";
                    for (var i = 0; i < WORDS.length; i++) { if (WORDS[i].en === k) { cn = WORDS[i].cn; break; } }
                    h += '<div class="item"><span>' + escapeHtml(cn) + ' (' + k + ')</span><span class="bad">答错 ' + state.wrongCount[k] + ' 次</span></div>';
                }
            }
            h += '</div>';
        }
        h += '<button class="btn-replay" onclick="document.body.removeChild(this.parentElement.parentElement);window._restart()">🔄 再来一局</button>';
        h += '</div>';
        overlay.innerHTML = h;
        document.body.appendChild(overlay);
    }

    window._restart = function() {
        // Reload from storage
        WORDS = loadWords();
        buildCards();
    };

    function escapeHtml(str) {
        return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // === Word Management ===
    function renderWordList() {
        var list = $("wordList");
        var h = '';
        for (var i = 0; i < WORDS.length; i++) {
            h += '<div class="wl-item">';
            h += '<span><b>' + escapeHtml(WORDS[i].en) + '</b> — ' + escapeHtml(WORDS[i].cn) + '</span>';
            h += '<button class="btn-del" data-idx="' + i + '">✕</button>';
            h += '</div>';
        }
        list.innerHTML = h;
        $("wordCountHint").textContent = '共 ' + WORDS.length + ' 个单词（每局随机抽6个）';
        // Bind delete
        var dels = list.querySelectorAll('.btn-del');
        for (var i = 0; i < dels.length; i++) {
            dels[i].addEventListener('click', function(e) {
                var idx = parseInt(this.getAttribute('data-idx'));
                WORDS.splice(idx, 1);
                saveWords(WORDS);
                renderWordList();
                buildCards();
            });
        }
    }

    function addWord() {
        var en = $("newEn").value.trim();
        var cn = $("newCn").value.trim();
        if (!en || !cn) { alert("英文和中文都要填哦！"); return; }
        // Check duplicate
        for (var i = 0; i < WORDS.length; i++) {
            if (WORDS[i].en.toLowerCase() === en.toLowerCase()) {
                alert("'" + en + "' 已经存在了！");
                return;
            }
        }
        WORDS.push({ en: en, cn: cn });
        saveWords(WORDS);
        renderWordList();
        buildCards();
        $("newEn").value = "";
        $("newCn").value = "";
        $("newEn").focus();
    }

    function resetWords() {
        if (confirm("确定要恢复为默认单词列表吗？你添加的单词会被清空。")) {
            WORDS = DEFAULT_WORDS.slice();
            saveWords(WORDS);
            renderWordList();
            buildCards();
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        buildCards();

        // Word manager buttons
        var panel = $("managePanel");
        $("btnWords").addEventListener("click", function() {
            var show = !panel.classList.contains("show");
            if (show) {
                panel.classList.add("show");
                renderWordList();
                $("btnWords").textContent = "✕ 关闭";
            } else {
                panel.classList.remove("show");
                $("btnWords").textContent = "📝 管理单词";
            }
        });
        $("btnCloseManage").addEventListener("click", function() {
            panel.classList.remove("show");
            $("btnWords").textContent = "📝 管理单词";
        });
        $("btnAdd").addEventListener("click", addWord);
        $("btnReset").addEventListener("click", function(e) {
            e.stopPropagation();
            resetWords();
        });
        $("newCn").addEventListener("keydown", function(e) {
            if (e.key === "Enter") addWord();
        });
        $("newEn").addEventListener("keydown", function(e) {
            if (e.key === "Enter") { e.preventDefault(); $("newCn").focus(); }
        });
    });
})();
</script>


</body></html>
